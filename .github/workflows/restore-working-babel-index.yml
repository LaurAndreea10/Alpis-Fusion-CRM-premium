name: Restore working Babel index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-working-babel-index.yml'
      - '.github/restore-working-babel-index-trigger.txt'
      - '.github/restore-working-babel-index-trigger-2.txt'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last known working index from blob
        run: |
          set -euo pipefail
          git cat-file -p 68af3c797c101fcb38563b089a2d7695c79bb376 > index.html

      - name: Commit working restore
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(app): restore working inline React page"
          git push
